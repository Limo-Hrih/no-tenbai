name: build-and-deploy

on:
  workflow_dispatch:
  # Creators APIが使えるようになったら、下の2行のコメントを外して毎日自動更新にする
  # schedule:
  #   - cron: "0 21 * * *"   # 毎日 日本時間6:00

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          CREATORS_CREDENTIAL_VERSION: ${{ secrets.CREATORS_CREDENTIAL_VERSION }}
          PARTNER_TAG: ${{ secrets.PARTNER_TAG || 'limolimo-22' }}
        run: python src/build.py --notice "テスト公開中です。使ってみた感想・ご意見をお聞かせください。"
      # 「今日から」判定用のASIN一覧だけをコミットする（価格はコミットしない）
      - name: Save ASIN state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/state/amazon_asins.json
          git diff --cached --quiet || git commit -m "update ASIN state"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
